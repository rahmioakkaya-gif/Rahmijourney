<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahmi Journey</title>
    <style>
        /* Basic page styling */
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        
        /* The button that opens the pop-up */
        #aboutBtn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #24292e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* The Modal (background overlay) */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; 
            z-index: 1; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.5); /* Black with opacity */
        }

        /* Modal Content Box */
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%; /* Could be more or less, depending on screen size */
            max-width: 500px;
            border-radius: 10px;
            position: relative;
            text-align: left;
        }

        /* The Close Button */
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Welcome to my website!</h1>
    <p>This site is hosted on GitHub Pages.</p>

    <!-- This is the button to open the pop-up -->
    <button id="aboutBtn">About Me</button>

    <!-- This is the pop-up (modal) itself -->
    <div id="aboutModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>About Me</h2>
            <p>Hello! I am Rahmi. Welcome to my journey. This is a pop-up window built with HTML, CSS, and JavaScript!</p>
        </div>
    </div>

    <script>
        // Get the elements
        var modal = document.getElementById("aboutModal");
        var btn = document.getElementById("aboutBtn");
        var span = document.getElementsByClassName("close")[0];

        // When the user clicks the button, open the modal 
        btn.onclick = function() {
            modal.style.display = "block";
        }

        // When the user clicks on <span> (x), close the modal
        span.onclick = function() {
            modal.style.display = "none";
        }

        // When the user clicks anywhere outside of the modal, close it
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
