<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahmi Journey</title>
    <style>
        /* BACKGROUND SETTINGS */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            /* This loads your image */
            background-image: url('IMG_20260910_195826.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            /* Centers the text box on the screen */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* TEXT BACKGROUND BOX */
        .content-box {
            background-color: rgba(255, 255, 255, 0.9); /* White with 90% opacity */
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); /* Gives the box a nice shadow */
            color: #333; /* Dark text color */
        }

        /* ABOUT BUTTON STYLING */
        #aboutBtn {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #24292e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        #aboutBtn:hover {
            background-color: #444;
        }

        /* POP-UP (MODAL) STYLING */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; 
            z-index: 10; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.6); /* Dark overlay */
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; 
            padding: 30px;
            border: 1px solid #888;
            width: 80%; 
            max-width: 500px;
            border-radius: 10px;
            position: relative;
            text-align: left;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* CLOSE BUTTON (X) STYLING */
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- This box sits on top of your background image -->
    <div class="content-box">
        <h1>Welcome to my website!</h1>
        <p>This site is hosted on GitHub Pages.</p>
        <button id="aboutBtn">About Me</button>
    </div>

    <!-- The About Pop-up -->
    <div id="aboutModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>About Me</h2>
            <p>Hello! I am Rahmi. Welcome to my journey. This is a pop-up window built with HTML, CSS, and JavaScript!</p>
        </div>
    </div>

    <!-- JavaScript for the Pop-up -->
    <script>
        var modal = document.getElementById("aboutModal");
        var btn = document.getElementById("aboutBtn");
        var span = document.getElementsByClassName("close")[0];

        // Open the pop-up when the button is clicked
        btn.onclick = function() {
            modal.style.display = "block";
        }

        // Close the pop-up when the 'X' is clicked
        span.onclick = function() {
            modal.style.display = "none";
        }

        // Close the pop-up when clicking anywhere outside the box
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
